[workspace]
resolver = "3"
members = ["crates/*", "solver/plxs-*"]
exclude = ["vendor/egui-snarl"]

[workspace.package]
version = "0.2.4"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/KwentiN-ui/Nodalis"

[workspace.dependencies]
plx-core = { path = "crates/plx-core" }
plx-mesh = { path = "crates/plx-mesh" }
plx-model = { path = "crates/plx-model" }
plx-io = { path = "crates/plx-io" }
plx-results = { path = "crates/plx-results" }
plx-mesher = { path = "crates/plx-mesher" }
plx-render = { path = "crates/plx-render" }
plx-solve = { path = "crates/plx-solve" }

# The Nodalis solver (solver/, prefix plxs-). Numerics come from one ecosystem only: faer for
# dense and sparse linear algebra and rayon for parallelism; no second numerics crate beside them.
plxs-core = { path = "solver/plxs-core" }
plxs-input = { path = "solver/plxs-input" }
plxs-verify = { path = "solver/plxs-verify" }
plxs-cli = { path = "solver/plxs-cli" }
plxs-linalg = { path = "solver/plxs-linalg" }
plxs-elements = { path = "solver/plxs-elements" }
plxs-materials = { path = "solver/plxs-materials" }
plxs-constraints = { path = "solver/plxs-constraints" }
plxs-contact = { path = "solver/plxs-contact" }
plxs-assembly = { path = "solver/plxs-assembly" }
plxs-procedures = { path = "solver/plxs-procedures" }
plxs-output = { path = "solver/plxs-output" }
plxs-session = { path = "solver/plxs-session" }
faer = "0.24"
rayon = "1.12"
postcard = { version = "1.1", features = ["use-std"] }

base64 = "0.22"
bytemuck = { version = "1.25", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cpal = "0.18"
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "persistence",
    "wgpu",
    "wayland",
    "x11",
] }
egui = "0.36"
# Vendored, with the mouse controls of the schematic changed (vendor/egui-snarl).
egui-snarl = { path = "vendor/egui-snarl" }
egui-wgpu = "0.36"
egui_plot = "0.37"
nucleo-matcher = "0.3"
env_logger = "0.11"
flate2 = "1"
gif = "0.14"
glam = { version = "0.34", features = ["bytemuck"] }
log = "0.4"
open = "5"
png = "0.18"
rfd = "0.17"
ron = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
# HTTPS for the update check; the system's certificates and (on Windows) proxy, as a browser.
# Compression of results on disk (plxs-output::packed); builds its C sources with the C
# compiler that ring (rustls) needs already.
zstd = { version = "0.13", default-features = false }
ureq = { version = "3.4", default-features = false, features = [
    "rustls",
    "platform-verifier",
    "win-system-proxy",
] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2

# The numerics of the solver run optimized in debug builds too: unoptimized, the solver
# fixtures and the tests that solve take many times longer (a buckling fixture with the
# iterative solver ran for over half an hour in the CI instead of seconds).
[profile.dev.package.plxs-linalg]
opt-level = 2
[profile.dev.package.plxs-elements]
opt-level = 2
[profile.dev.package.plxs-materials]
opt-level = 2
[profile.dev.package.plxs-assembly]
opt-level = 2
[profile.dev.package.plxs-contact]
opt-level = 2
[profile.dev.package.plxs-constraints]
opt-level = 2
[profile.dev.package.plxs-procedures]
opt-level = 2

# Profil für die CI: wie dev (Abhängigkeiten und Solver-Numerik optimiert, im Cache), ohne
# Debug-Infos.
[profile.ci]
inherits = "dev"
debug = false
