[package]
name = "plxs-cli"
description = "Nodalis solver: command line plxs, a drop-in replacement for ccx"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "plxs"
path = "src/main.rs"

[dependencies]
plxs-core.workspace = true
plxs-input.workspace = true
plxs-session.workspace = true
plxs-output.workspace = true
plxs-elements.workspace = true
plxs-linalg.workspace = true
plxs-explicit.workspace = true

[features]
# The multigrid cycle of the iterative solver on a discrete graphics card (`PLXS_GPU`).
default = ["gpu"]
gpu = ["plxs-linalg/gpu", "plxs-explicit/gpu"]

[dev-dependencies]
plxs-verify.workspace = true
plx-io.workspace = true

[lints]
workspace = true
