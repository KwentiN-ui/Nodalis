[package]
name = "plxs-linalg"
description = "Nodalis solver: sparse matrices, direct and iterative linear solvers, eigensolvers (faer)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
faer.workspace = true
rayon.workspace = true
plxs-core.workspace = true
# The multigrid cycle on the graphics card (feature `gpu`).
plxs-gpu = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }

[features]
gpu = ["dep:plxs-gpu", "dep:bytemuck"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

[lints]
workspace = true
