[package]
name = "plxs-linalg"
description = "Nodalis solver: sparse matrices, direct and iterative linear solvers, eigensolvers (faer)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
faer.workspace = true
rayon.workspace = true
plxs-core.workspace = true
# The multigrid cycle on the graphics card (feature `gpu`): the wgpu of the user interface.
wgpu = { version = "30", optional = true, default-features = false, features = [
    "std",
    "parking_lot",
    "wgsl",
    "vulkan",
    "dx12",
    "metal",
] }
pollster = { version = "1", optional = true }
bytemuck = { workspace = true, optional = true }

[features]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

[lints]
workspace = true
